<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- 第一层光晕：核心亮光 -->
    <linearGradient id="coreGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="15%" stop-color="#ffdd44" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#ffaa00" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ff6600" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>

    <!-- 第二层光晕：外围扩散 -->
    <linearGradient id="outerGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffdd88" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#ff8800" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#ff4400" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </linearGradient>

    <!-- 第三层：微弱的环境光晕 -->
    <linearGradient id="ambientGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffcc44" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#ff6600" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#330000" stop-opacity="0"/>
    </linearGradient>

    <!-- 光柱效果 -->
    <linearGradient id="lightBeam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="10%" stop-color="#ffdd66" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#ffaa33" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff4400" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 环境光晕（最外层，最宽） -->
  <rect x="0" y="0" width="400" height="500" fill="url(#ambientGlow)"/>

  <!-- 外围光晕（中层） -->
  <rect x="0" y="0" width="400" height="500" fill="url(#outerGlow)"/>

  <!-- 核心光晕（内层，亮度最高） -->
  <rect x="0" y="0" width="400" height="500" fill="url(#coreGlow)"/>

  <!-- 中央光柱 -->
  <rect x="160" y="0" width="80" height="500" fill="url(#lightBeam)"/>

  <!-- 底部边缘高亮 -->
  <ellipse cx="200" cy="480" rx="120" ry="30" fill="#ffdd66" opacity="0.3"/>
  <ellipse cx="200" cy="480" rx="60" ry="15" fill="#ffffff" opacity="0.4"/>
</svg>