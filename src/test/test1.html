<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>径向渐变扇形护盾 - 纯净能量罩</title>
  <style>
    body {
      background: linear-gradient(145deg, #0a0f1e 0%, #05080f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', monospace;
    }

    .demo-container {
      text-align: center;
    }

    canvas {
      display: block;
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.2);
      background: #03060c;
      cursor: default;
    }

    .caption {
      margin-top: 16px;
      color: #0cf;
      font-size: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 4px #0cf;
      background: rgba(0, 0, 0, 0.5);
      display: inline-block;
      padding: 6px 18px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
    }
  </style>
</head>

<body>
  <div class="demo-container">
    <canvas id="shieldCanvas" width="700" height="600"></canvas>
    <div class="caption">🛡️ 径向渐变扇形护盾 | 仅外层能量罩 | 中间透明 🛡️</div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('shieldCanvas');
      const ctx = canvas.getContext('2d');

      // 飞机位置 (护盾以飞机为中心)
      const centerX = 350;
      const centerY = 500;

      // 扇形护盾参数 (朝向正上方，覆盖机头前方区域)
      const shieldRadius = 66;           // 护盾半径
      const startAngle = Math.PI;  // 起始角度 -147.6度
      const endAngle = 2 * Math.PI     // 结束角度 -32.4度，形成约115度的扇形

      // 护盾边缘厚度
      const edgeWidth = 4.5;

      // 绘制函数: 使用径向渐变绘制扇形能量罩，中间完全透明
      function drawSectorShield() {

        const renderCanvas = document.createElement('canvas');
        const renderContext = renderCanvas.getContext('2d');
        renderCanvas.width = shieldRadius * 2;
        renderCanvas.height = shieldRadius;
        // renderContext.fillStyle = 'yellow'
        // renderContext.fillRect(0, 0, shieldRadius * 2, shieldRadius);

        // 绘制示意飞机 (便于观察护盾位置)
        renderContext.save()
        // 做一个线性渐变，从内到外，颜色从透明到不透明
        const gradient = renderContext.createLinearGradient(0,0,shieldRadius*2,0);
        gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
        gradient.addColorStop(0.5, 'rgba(0, 0, 0, 1)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

        // 绘制护盾主体
        renderContext.beginPath();
        renderContext.fillStyle = gradient
        renderContext.fillRect(0,0, shieldRadius * 2, shieldRadius);
        renderContext.fill();

        renderContext.globalCompositeOperation = "source-in";

        renderContext.beginPath();
        renderContext.moveTo(shieldRadius, shieldRadius);
        renderContext.arc(shieldRadius,shieldRadius, shieldRadius, startAngle, endAngle);
        renderContext.closePath();
        const outerGlowGrad = renderContext.createRadialGradient(shieldRadius, shieldRadius, shieldRadius - 10, shieldRadius, shieldRadius, shieldRadius);
        outerGlowGrad.addColorStop(0, 'rgba(0, 180, 240, 0)');
        outerGlowGrad.addColorStop(0.8, 'rgba(0, 200, 255, 0.35)');
        outerGlowGrad.addColorStop(1, 'rgba(0, 210, 255, 0.92)');
        renderContext.fillStyle = outerGlowGrad;
        renderContext.fill();
        renderContext.restore()

        ctx.drawImage(renderCanvas, centerX - shieldRadius, centerY - shieldRadius);
        drawAirplane()
      }

      // 绘制简单的飞机轮廓 (仅用于示意护盾位置)
      function drawAirplane() {
        ctx.save();
        ctx.shadowBlur = 0;
        // 主体三角战机
        ctx.beginPath();
        ctx.moveTo(centerX, centerY - 28);
        ctx.lineTo(centerX - 18, centerY + 6);
        ctx.lineTo(centerX - 8, centerY + 2);
        ctx.lineTo(centerX - 8, centerY + 14);
        ctx.lineTo(centerX, centerY + 10);
        ctx.lineTo(centerX + 8, centerY + 14);
        ctx.lineTo(centerX + 8, centerY + 2);
        ctx.lineTo(centerX + 18, centerY + 6);
        ctx.closePath();
        ctx.fillStyle = '#4a6a8a';
        ctx.fill();
        ctx.strokeStyle = '#8cc9ff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 座舱
        ctx.beginPath();
        ctx.arc(centerX, centerY - 16, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#2f6f9f';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(centerX - 2, centerY - 18, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#b3e4ff';
        ctx.fill();

        // 机翼
        ctx.beginPath();
        ctx.moveTo(centerX - 18, centerY + 6);
        ctx.lineTo(centerX - 12, centerY);
        ctx.lineTo(centerX - 8, centerY + 2);
        ctx.fillStyle = '#3a5a7a';
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(centerX + 18, centerY + 6);
        ctx.lineTo(centerX + 12, centerY);
        ctx.lineTo(centerX + 8, centerY + 2);
        ctx.fill();

        // 引擎尾焰
        ctx.beginPath();
        ctx.moveTo(centerX - 5, centerY + 12);
        ctx.lineTo(centerX, centerY + 22);
        ctx.lineTo(centerX + 5, centerY + 12);
        ctx.fillStyle = '#ff8844aa';
        ctx.fill();
        ctx.restore();
      }

      // 简单的呼吸光效 (只改变护盾边缘亮度，无额外元素)
      let phase = 0;
      let animationId = null;

      function animateShieldGlow() {
        ctx.fillStyle = 'pink'
        ctx.fillRect(0, 0, 1000, 500)
        drawSectorShield();
      }

      animateShieldGlow();
    })();
  </script>
</body>

</html>
