<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞机大战 · 状态切换</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0f1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .canvas-wrapper {
            background: #111a28;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
        }
        canvas {
            display: block;
            width: 700px;
            height: 200px;
            border-radius: 12px;
            background: #0d1520;
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7);
        }
        .controls {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            padding: 10px 32px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Orbitron', 'Rajdhani', 'Arial', sans-serif;
            text-transform: uppercase;
        }
        .btn-boss {
            background: linear-gradient(135deg, #a02020, #d03030);
            color: #fff;
            box-shadow: 0 4px 20px rgba(200, 40, 30, 0.4);
        }
        .btn-boss:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(200, 40, 30, 0.6);
        }
        .btn-boss.active {
            background: linear-gradient(135deg, #d03030, #f06030);
            box-shadow: 0 4px 30px rgba(200, 40, 30, 0.8);
            outline: 2px solid #f06030;
            outline-offset: 2px;
        }
        .btn-victory {
            background: linear-gradient(135deg, #1a7a3a, #2ecc71);
            color: #fff;
            box-shadow: 0 4px 20px rgba(46, 204, 113, 0.4);
        }
        .btn-victory:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(46, 204, 113, 0.6);
        }
        .btn-victory.active {
            background: linear-gradient(135deg, #2ecc71, #1abc9c);
            box-shadow: 0 4px 30px rgba(46, 204, 113, 0.8);
            outline: 2px solid #2ecc71;
            outline-offset: 2px;
        }
        .status-text {
            color: #6a8a9a;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 300;
            margin-top: 4px;
        }
        .status-text span {
            color: #aac0d0;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="700" height="200"></canvas>
        </div>
        <div class="controls">
            <button class="btn btn-boss active" id="btnBoss">⚡ BOSS 来袭</button>
            <button class="btn btn-victory" id="btnVictory">✦ 通关成功</button>
        </div>
        <div class="status-text">
            当前状态：<span id="statusLabel">BOSS 来袭</span>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const btnBoss = document.getElementById('btnBoss');
            const btnVictory = document.getElementById('btnVictory');
            const statusLabel = document.getElementById('statusLabel');

            // ---------- 两种状态配置 ----------
            const BOSS_CONFIG = {
                text: 'BOSS来袭',
                fontSize: 78,
                fontFamily: '"Orbitron", "Rajdhani", "Arial Black", sans-serif',
                colorStart: '#a02020',
                colorMid: '#d03030',
                colorEnd: '#f06030',
                shadowColor: 'rgba(0, 0, 0, 0.95)',
                shadowBlur: 12,
                shadowOffsetX: 4,
                shadowOffsetY: 6,
                accentShadow: 'rgba(180, 30, 30, 0.5)',
                accentBlur: 25,
                glowColor: 'rgba(200, 40, 20, 0.12)',
                // 背景光晕色
                bgGlow: 'rgba(80, 20, 10, 0.15)',
                lineColor: 'rgba(200, 40, 20, 0.25)',
                subText: '◈ 最高警戒 ◈',
                subColor: 'rgba(180, 50, 30, 0.2)',
                cornerColor: 'rgba(200, 60, 30, 0.15)',
                starColor: 'rgba(200, 60, 30, 0.08)',
                statusLabel: 'BOSS 来袭',
            };

            const VICTORY_CONFIG = {
                text: '通关成功',
                fontSize: 78,
                fontFamily: '"Orbitron", "Rajdhani", "Arial Black", sans-serif',
                colorStart: '#2ecc71',
                colorMid: '#27ae60',
                colorEnd: '#1abc9c',
                shadowColor: 'rgba(10, 30, 20, 0.9)',
                shadowBlur: 14,
                shadowOffsetX: 4,
                shadowOffsetY: 6,
                accentShadow: 'rgba(46, 204, 113, 0.3)',
                accentBlur: 25,
                glowColor: 'rgba(46, 204, 113, 0.12)',
                bgGlow: 'rgba(46, 204, 113, 0.06)',
                lineColor: 'rgba(46, 204, 113, 0.20)',
                subText: '✦ 完美通关 ✦',
                subColor: 'rgba(46, 204, 113, 0.15)',
                cornerColor: 'rgba(46, 204, 113, 0.12)',
                starColor: 'rgba(46, 204, 113, 0.15)',
                statusLabel: '通关成功',
            };

            let currentConfig = BOSS_CONFIG;
            let currentMode = 'boss'; // 'boss' | 'victory'

            // ---------- 绘制函数 ----------
            function drawText(config) {
                ctx.clearRect(0, 0, 700, 200);

                // ---- 背景光晕 ----
                // const bgGrad = ctx.createRadialGradient(350, 100, 10, 350, 100, 280);
                // bgGrad.addColorStop(0, config.bgGlow);
                // bgGrad.addColorStop(0.5, 'rgba(0,0,0,0)');
                // bgGrad.addColorStop(1, 'rgba(0,0,0,0)');
                // ctx.fillStyle = bgGrad;
                // ctx.fillRect(0, 0, 700, 200);

                // ---- 星点 ----
                // ctx.save();
                // const stars = [
                //     [80, 30], [120, 160], [600, 40], [650, 150],
                //     [50, 100], [680, 80], [200, 30], [500, 170],
                //     [300, 20], [420, 175], [580, 120], [100, 70]
                // ];
                // stars.forEach(([x, y]) => {
                //     const size = 1.2 + Math.random() * 2.2;
                //     ctx.fillStyle = config.starColor;
                //     ctx.globalAlpha = 0.3 + Math.random() * 0.4;
                //     ctx.beginPath();
                //     ctx.arc(x, y, size, 0, Math.PI * 2);
                //     ctx.fill();
                // });
                // ctx.restore();

                // ---- 文字参数 ----
                const text = config.text;
                const fontSize = config.fontSize;
                const fontFamily = config.fontFamily;
                const cStart = config.colorStart;
                const cMid = config.colorMid;
                const cEnd = config.colorEnd;
                const shadowColor = config.shadowColor;
                const shadowBlur = config.shadowBlur;
                const shadowX = config.shadowOffsetX;
                const shadowY = config.shadowOffsetY;
                const accentShadow = config.accentShadow;
                const accentBlur = config.accentBlur;
                const glowColor = config.glowColor;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const cx = 350;
                const cy = 100;

                // ----- 1. 光晕 -----
                // ctx.save();
                // ctx.shadowColor = glowColor;
                // ctx.shadowBlur = 55;
                // ctx.font = `900 ${fontSize}px ${fontFamily}`;
                // ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
                // ctx.fillText(text, cx, cy);
                // ctx.restore();

                // ----- 2. 强调阴影 (彩色轮廓) -----
                // ctx.save();
                // ctx.shadowColor = accentShadow;
                // ctx.shadowBlur = accentBlur;
                // ctx.shadowOffsetX = 0;
                // ctx.shadowOffsetY = 0;
                // ctx.font = `900 ${fontSize}px ${fontFamily}`;
                // ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
                // ctx.fillText(text, cx, cy);
                // ctx.restore();

                // ----- 3. 主文字 + 深色阴影 -----
                ctx.save();
                ctx.font = `900 ${fontSize}px ${fontFamily}`;
                ctx.shadowColor = shadowColor;
                ctx.shadowBlur = shadowBlur;
                ctx.shadowOffsetX = shadowX;
                ctx.shadowOffsetY = shadowY;

                const grad = ctx.createLinearGradient(cx - 160, cy - 50, cx + 160, cy + 50);
                grad.addColorStop(0, cStart);
                grad.addColorStop(0.35, cMid);
                grad.addColorStop(0.7, cStart);
                grad.addColorStop(1, cEnd);
                ctx.fillStyle = grad;
                ctx.fillText(text, cx, cy);

                // 高光
                ctx.shadowBlur = 0;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 0;
                ctx.fillStyle = 'rgba(255, 255, 240, 0.06)';
                ctx.fillText(text, cx - 1, cy - 2);
                ctx.restore();

                // ----- 4. 底部飘带 -----
                ctx.save();
                const gradLine = ctx.createLinearGradient(150, 0, 550, 0);
                gradLine.addColorStop(0, 'rgba(255,255,255,0)');
                gradLine.addColorStop(0.3, config.lineColor);
                gradLine.addColorStop(0.5, config.lineColor);
                gradLine.addColorStop(0.7, config.lineColor);
                gradLine.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradLine;
                ctx.fillRect(0, 172, 700, 2);

                ctx.fillStyle = config.subColor;
                ctx.font = '11px "Arial", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(config.subText, cx, 163);
                ctx.restore();

                // ----- 5. 角标 -----
                ctx.save();
                ctx.strokeStyle = config.cornerColor;
                ctx.lineWidth = 2;
                const corner = 20;
                const pts = [
                    [cx - 240, cy - 60],
                    [cx + 240, cy - 60],
                    [cx - 240, cy + 60],
                    [cx + 240, cy + 60]
                ];
                pts.forEach(([x, y]) => {
                    ctx.beginPath();
                    ctx.moveTo(x - corner, y);
                    ctx.lineTo(x, y);
                    ctx.lineTo(x, y - corner);
                    ctx.stroke();
                });
                ctx.restore();
            }

            // ---------- 切换状态 ----------
            function setMode(mode) {
                currentMode = mode;
                if (mode === 'boss') {
                    currentConfig = BOSS_CONFIG;
                    btnBoss.classList.add('active');
                    btnVictory.classList.remove('active');
                    statusLabel.textContent = 'BOSS 来袭';
                    statusLabel.style.color = '#f06030';
                } else {
                    currentConfig = VICTORY_CONFIG;
                    btnVictory.classList.add('active');
                    btnBoss.classList.remove('active');
                    statusLabel.textContent = '通关成功';
                    statusLabel.style.color = '#2ecc71';
                }
                drawText(currentConfig);
            }

            // ---------- 按钮事件 ----------
            btnBoss.addEventListener('click', () => setMode('boss'));
            btnVictory.addEventListener('click', () => setMode('victory'));

            // ---------- 动画 (光晕呼吸) ----------
            let startTime = performance.now();
            let animId = null;

            function animate() {
                const t = performance.now() - startTime;
                const pulse = Math.sin(t / 800) * 0.3 + 0.7;

                // 动态调整光晕强度 (仅针对当前配置)
                if (currentMode === 'boss') {
                    const alpha = 0.08 + pulse * 0.06;
                    BOSS_CONFIG.glowColor = `rgba(200, 40, 20, ${alpha})`;
                    BOSS_CONFIG.bgGlow = `rgba(80, 20, 10, ${0.10 + pulse * 0.06})`;
                } else {
                    const alpha = 0.08 + pulse * 0.06;
                    VICTORY_CONFIG.glowColor = `rgba(46, 204, 113, ${alpha})`;
                    VICTORY_CONFIG.bgGlow = `rgba(46, 204, 113, ${0.04 + pulse * 0.03})`;
                }

                drawText(currentConfig);
                animId = requestAnimationFrame(animate);
            }

            // ---------- 启动 ----------
            setMode('boss');
            animate();

            // 清理动画
            window.addEventListener('beforeunload', () => {
                if (animId) cancelAnimationFrame(animId);
            });

        })();
    </script>
</body>
</html>
