<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞机大战 - 敌机旋转发射螺旋子弹</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0f2a 0%, #0a0a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            border: 2px solid #00ffaa;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.3);
            cursor: none;
        }
        
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffaa;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
        
        .score {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffaa00;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            display: none;
            z-index: 20;
            white-space: nowrap;
            border: 2px solid #ff0000;
        }
        
        .restart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background: #00ffaa;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .restart-btn:hover {
            background: #ffaa00;
        }
    </style>
</head>
<body>
    <div class="info">
        🎮 敌机旋转发射螺旋子弹<br>
        🔫 鼠标移动控制战机 | 点击射击
    </div>
    <div class="score">
        得分: <span id="scoreValue">0</span>
    </div>
    <div class="controls">
        🖱️ 鼠标移动 → 控制战机<br>
        🔫 鼠标点击 → 发射子弹<br>
        💀 碰到红色子弹即死亡
    </div>
    <div class="game-over" id="gameOver">
        游戏结束!<br>
        <button class="restart-btn" onclick="restartGame()">重新开始</button>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <script>
        // 获取canvas元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 设置canvas尺寸
        canvas.width = 1000;
        canvas.height = 700;
        
        // ========== 游戏状态 ==========
        let gameRunning = true;
        let score = 0;
        
        // ========== 玩家设置 ==========
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 60,
            width: 30,
            height: 30,
            radius: 15,
            speed: 8
        };
        
        // 玩家子弹数组
        let playerBullets = [];
        
        // 玩家射击冷却
        let shootCooldown = 0;
        const SHOOT_DELAY = 8; // 帧数间隔
        
        // ========== 敌机设置 ==========
        let enemies = [];
        
        // 敌人类
        class Enemy {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 40;
                this.height = 40;
                this.radius = 20;
                // 发射角度（弧度）
                this.angle = 0;
                // 角速度（弧度/帧）
                this.angularSpeed = 0.05 + Math.random() * 0.08;
                // 射击计数器
                this.shootTimer = 0;
                // 射击间隔（帧）
                this.shootInterval = 5 + Math.floor(Math.random() * 8);
                // 子弹速度
                this.bulletSpeed = 4 + Math.random() * 3;
                // 移动方向
                this.moveAngle = Math.random() * Math.PI * 2;
                this.moveSpeed = 1 + Math.random() * 2;
            }
            
            update(bulletsArray) {
                // 更新射击计数器
                this.shootTimer++;
                if (this.shootTimer >= this.shootInterval && gameRunning) {
                    this.shootTimer = 0;
                    this.shoot(bulletsArray);
                }
                
                // 更新发射角度（持续旋转）
                this.angle += this.angularSpeed;
                
                // 敌机移动（可选，让敌机飘移）
                this.x += Math.cos(this.moveAngle) * this.moveSpeed;
                this.y += Math.sin(this.moveAngle) * this.moveSpeed;
                
                // 边界反弹
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.moveAngle = Math.PI - this.moveAngle;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.moveAngle = Math.PI - this.moveAngle;
                }
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.moveAngle = -this.moveAngle;
                }
                if (this.y + this.radius > canvas.height / 2) {
                    this.y = canvas.height / 2 - this.radius;
                    this.moveAngle = -this.moveAngle;
                }
            }
            
            shoot(bulletsArray) {
                // 计算子弹速度向量
                const vx = Math.cos(this.angle) * this.bulletSpeed;
                const vy = Math.sin(this.angle) * this.bulletSpeed;
                
                // 创建子弹
                const bullet = new EnemyBullet(this.x, this.y, vx, vy);
                bulletsArray.push(bullet);
            }
            
            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ff0000";
                
                // 绘制敌机身体
                ctx.fillStyle = "#ff3366";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制敌机眼睛
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(this.x - 8, this.y - 5, 5, 0, Math.PI * 2);
                ctx.arc(this.x + 8, this.y - 5, 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(this.x - 7, this.y - 6, 2, 0, Math.PI * 2);
                ctx.arc(this.x + 9, this.y - 6, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 绘制发射方向指示器
                ctx.strokeStyle = "#ffff00";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                const dirX = this.x + Math.cos(this.angle) * 25;
                const dirY = this.y + Math.sin(this.angle) * 25;
                ctx.lineTo(dirX, dirY);
                ctx.stroke();
                
                // 绘制旋转光环
                ctx.strokeStyle = "#ff00ff";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 3, 0, Math.PI * 2);
                ctx.stroke();
                
                ctx.restore();
            }
        }
        
        // ========== 子弹类 ==========
        
        // 敌方子弹
        class EnemyBullet {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 4;
                this.life = true;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                // 超出边界则标记为死亡
                if (this.x + this.radius < 0 || this.x - this.radius > canvas.width ||
                    this.y + this.radius < 0 || this.y - this.radius > canvas.height) {
                    this.life = false;
                }
            }
            
            draw() {
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#ff0000";
                ctx.fillStyle = "#ff0000";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // 添加拖尾效果
                ctx.fillStyle = "#ff6600";
                ctx.beginPath();
                ctx.arc(this.x - this.vx * 2, this.y - this.vy * 2, this.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // 玩家子弹
        class PlayerBullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = -8;
                this.radius = 3;
                this.life = true;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.y + this.radius < 0) {
                    this.life = false;
                }
            }
            
            draw() {
                ctx.save();
                ctx.shadowBlur = 5;
                ctx.shadowColor = "#00ffaa";
                ctx.fillStyle = "#00ffaa";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // ========== 粒子效果（爆炸） ==========
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.life = 1;
                this.color = color;
                this.size = Math.random() * 4 + 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
                return this.life > 0;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        let particles = [];
        
        function addExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        // ========== 游戏逻辑 ==========
        
        // 生成新敌机
        function spawnEnemy() {
            const x = Math.random() * (canvas.width - 80) + 40;
            const y = Math.random() * 200 + 50;
            enemies.push(new Enemy(x, y));
        }
        
        // 更新玩家子弹
        function updatePlayerBullets() {
            for (let i = 0; i < playerBullets.length; i++) {
                playerBullets[i].update();
                if (!playerBullets[i].life) {
                    playerBullets.splice(i, 1);
                    i--;
                }
            }
        }
        
        // 更新敌方子弹
        let enemyBullets = [];
        
        function updateEnemyBullets() {
            for (let i = 0; i < enemyBullets.length; i++) {
                enemyBullets[i].update();
                if (!enemyBullets[i].life) {
                    enemyBullets.splice(i, 1);
                    i--;
                }
            }
        }
        
        // 碰撞检测（圆形）
        function checkCollisions() {
            // 玩家子弹 vs 敌机
            for (let i = 0; i < playerBullets.length; i++) {
                const bullet = playerBullets[i];
                for (let j = 0; j < enemies.length; j++) {
                    const enemy = enemies[j];
                    const dx = bullet.x - enemy.x;
                    const dy = bullet.y - enemy.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < bullet.radius + enemy.radius) {
                        // 击中敌机
                        addExplosion(enemy.x, enemy.y, "#ff6666");
                        enemies.splice(j, 1);
                        playerBullets.splice(i, 1);
                        score += 10;
                        document.getElementById('scoreValue').textContent = score;
                        i--;
                        break;
                    }
                }
            }
            
            // 玩家 vs 敌方子弹（游戏结束条件）
            for (let i = 0; i < enemyBullets.length && gameRunning; i++) {
                const bullet = enemyBullets[i];
                const dx = bullet.x - player.x;
                const dy = bullet.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // if (distance < bullet.radius + player.radius) {
                //     gameRunning = false;
                //     addExplosion(player.x, player.y, "#ff0000");
                //     document.getElementById('gameOver').style.display = "block";
                //     break;
                // }
            }
            
            // 玩家 vs 敌机（直接碰撞也游戏结束）
            for (let i = 0; i < enemies.length && gameRunning; i++) {
                const enemy = enemies[i];
                const dx = enemy.x - player.x;
                const dy = enemy.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < enemy.radius + player.radius) {
                    gameRunning = false;
                    addExplosion(player.x, player.y, "#ff0000");
                    document.getElementById('gameOver').style.display = "block";
                    break;
                }
            }
        }
        
        // 玩家射击
        function shoot() {
            if (shootCooldown <= 0 && gameRunning) {
                playerBullets.push(new PlayerBullet(player.x, player.y - player.radius));
                shootCooldown = SHOOT_DELAY;
            }
        }
        
        // ========== 鼠标控制 ==========
        let mouseX = player.x;
        let mouseY = player.y;
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            mouseX = (e.clientX - rect.left) * scaleX;
            mouseY = (e.clientY - rect.top) * scaleY;
            
            // 限制范围
            mouseX = Math.min(Math.max(mouseX, player.radius), canvas.width - player.radius);
            mouseY = Math.min(Math.max(mouseY, player.radius), canvas.height - player.radius);
        });
        
        canvas.addEventListener('click', () => {
            shoot();
        });
        
        // 全局点击射击（防止鼠标移出canvas）
        document.addEventListener('click', (e) => {
            if (e.target === canvas || canvas.contains(e.target)) {
                shoot();
            }
        });
        
        // ========== 重启游戏 ==========
        window.restartGame = function() {
            gameRunning = true;
            score = 0;
            document.getElementById('scoreValue').textContent = score;
            document.getElementById('gameOver').style.display = "none";
            
            // 清空所有数组
            enemies = [];
            playerBullets = [];
            enemyBullets = [];
            particles = [];
            
            // 重置玩家位置
            player.x = canvas.width / 2;
            player.y = canvas.height - 60;
            mouseX = player.x;
            mouseY = player.y;
            
            // 重置冷却
            shootCooldown = 0;
            
            // 生成3个初始敌机
            for (let i = 0; i < 3; i++) {
                spawnEnemy();
            }
        };
        
        // ========== 更新和渲染 ==========
        
        function update() {
            if (!gameRunning) {
                // 游戏结束仍然更新粒子效果
                for (let i = 0; i < particles.length; i++) {
                    if (!particles[i].update()) {
                        particles.splice(i, 1);
                        i--;
                    }
                }
                return;
            }
            
            // 更新玩家位置（平滑跟随鼠标）
            player.x += (mouseX - player.x) * 0.3;
            player.y += (mouseY - player.y) * 0.3;
            
            // 边界限制
            player.x = Math.min(Math.max(player.x, player.radius), canvas.width - player.radius);
            player.y = Math.min(Math.max(player.y, player.radius), canvas.height - player.radius);
            
            // 更新射击冷却
            if (shootCooldown > 0) {
                shootCooldown--;
            }
            
            // 更新所有敌机
            for (let i = 0; i < enemies.length; i++) {
                enemies[i].update(enemyBullets);
                
                // 移除超出边界的敌机（保护性能）
                if (enemies[i].y > canvas.height + 100 || enemies[i].y < -100 ||
                    enemies[i].x > canvas.width + 100 || enemies[i].x < -100) {
                    enemies.splice(i, 1);
                    i--;
                }
            }
            
            // 生成新敌机
            if (enemies.length < 5 && Math.random() < 0.02) {
                spawnEnemy();
            }
            
            // 更新子弹
            updatePlayerBullets();
            updateEnemyBullets();
            
            // 碰撞检测
            checkCollisions();
            
            // 更新粒子效果
            for (let i = 0; i < particles.length; i++) {
                if (!particles[i].update()) {
                    particles.splice(i, 1);
                    i--;
                }
            }
        }
        
        function draw() {
            // 清空画布（星空效果）
            ctx.fillStyle = "#0a0a1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制星星
            for (let i = 0; i < 100; i++) {
                if (i % 2 === 0) continue; // 伪随机
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + Math.sin(Date.now() * 0.001 + i) * 0.2})`;
                ctx.fillRect((i * 131) % canvas.width, (i * 253) % canvas.height, 2, 2);
            }
            
            // 绘制网格线（科幻感）
            ctx.strokeStyle = "rgba(0, 255, 170, 0.1)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            // 绘制敌方子弹
            for (const bullet of enemyBullets) {
                bullet.draw();
            }
            
            // 绘制敌机
            for (const enemy of enemies) {
                enemy.draw();
            }
            
            // 绘制玩家子弹
            for (const bullet of playerBullets) {
                bullet.draw();
            }
            
            // 绘制玩家战机
            ctx.save();
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffaa";
            ctx.fillStyle = "#00ffaa";
            ctx.beginPath();
            // 三角形战机
            ctx.moveTo(player.x, player.y - player.radius);
            ctx.lineTo(player.x - player.radius, player.y + player.radius * 0.6);
            ctx.lineTo(player.x - player.radius * 0.5, player.y + player.radius * 0.3);
            ctx.lineTo(player.x - player.radius * 0.5, player.y + player.radius);
            ctx.lineTo(player.x, player.y + player.radius * 0.7);
            ctx.lineTo(player.x + player.radius * 0.5, player.y + player.radius);
            ctx.lineTo(player.x + player.radius * 0.5, player.y + player.radius * 0.3);
            ctx.lineTo(player.x + player.radius, player.y + player.radius * 0.6);
            ctx.fill();
            
            // 战机核心
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(player.x, player.y - 5, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            // 绘制粒子效果
            for (const particle of particles) {
                particle.draw();
            }
            
            // 绘制准星（鼠标位置指示）
            if (gameRunning) {
                ctx.save();
                ctx.globalAlpha = 0.5;
                ctx.strokeStyle = "#00ffaa";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(mouseX - 15, mouseY);
                ctx.lineTo(mouseX - 5, mouseY);
                ctx.moveTo(mouseX + 5, mouseY);
                ctx.lineTo(mouseX + 15, mouseY);
                ctx.moveTo(mouseX, mouseY - 15);
                ctx.lineTo(mouseX, mouseY - 5);
                ctx.moveTo(mouseX, mouseY + 5);
                ctx.lineTo(mouseX, mouseY + 15);
                ctx.stroke();
                ctx.restore();
            }
        }
        
        // ========== 游戏启动 ==========
        // 生成初始敌机
        for (let i = 0; i < 3; i++) {
            spawnEnemy();
        }
        
        // 游戏循环
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();
        
        // 窗口resize处理（保持比例）
        window.addEventListener('resize', () => {
            // 保持canvas原始大小
            canvas.style.width = '1000px';
            canvas.style.height = '700px';
        });
    </script>
</body>
</html>
